[project]
name = "receipts"
version = "0.1.0"
description = "Order totals, tax, discounts and splitting the bill."
requires-python = ">=3.10"
dependencies = ["python-dateutil>=2.8"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
